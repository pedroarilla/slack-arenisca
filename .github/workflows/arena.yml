name: Are.na to Slack Sync

on:
  schedule:
    - cron: '23 * * * *' # Minuto impar para evitar colas de GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Processed Blocks History
        uses: actions/cache/restore@v4
        id: cache-history
        with:
          path: processed_ids.txt
          key: arena-processed-blocks-history
          restore-keys: |
            arena-processed-blocks-

      - name: Fetch Selected Channels & Post New Items
        env:
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          CHANNELS: ${{ secrets.ARENA_CHANNELS }}
        run: |
          touch processed_ids.txt

          for CHANNEL in $CHANNELS; do
            # 1. Obtener la información del canal para extraer el TÍTULO REAL
            CHANNEL_INFO=$(curl -s -H "Authorization: Bearer $ARENA_TOKEN" "https://api.are.na/v3/channels/$CHANNEL")
            CHANNEL_NAME=$(echo "$CHANNEL_INFO" | jq -r '.title // "'$CHANNEL'"')

            # 2. Obtener los últimos 10 bloques del canal
            RESPONSE=$(curl -s -H "Authorization: Bearer $ARENA_TOKEN" "https://api.are.na/v3/channels/$CHANNEL/contents?per=10")
            
            echo "$RESPONSE" | jq -c '.data[]?' | tac | while read -r BLOCK; do
              BLOCK_ID=$(echo "$BLOCK" | jq -r '.id // empty')
              
              if [ -n "$BLOCK_ID" ] && [ "$BLOCK_ID" != "null" ]; then
                if grep -q "^${BLOCK_ID}$" processed_ids.txt; then
                  echo "El bloque $BLOCK_ID ya fue enviado previamente. Omitiendo..."
                else
                  TITLE=$(echo "$BLOCK" | jq -r '.title // .generated_title // "Nuevo contenido"')
                  
                  # 3. Extracción completa de imagen cubriendo todos los tipos de bloque en Are.na V3
                  IMAGE_URL=$(echo "$BLOCK" | jq -r '
                    .image.display.url // 
                    .image.large.url // 
                    .image.square.url // 
                    .image.original.url // 
                    .image_url // 
                    .src // 
                    .attachment.image_url // 
                    .attachment.url // 
                    .embed.image_url // 
                    empty
                  ')
                  
                  ARENA_BLOCK_URL="https://www.are.na/block/$BLOCK_ID"

                  # Comprobación de éxito para saber en la consola si encontró la URL
                  echo "Bloque ID $BLOCK_ID -> URL de Imagen detectada: '$IMAGE_URL'"

                  # 4. Construcción del payload de Slack
                  if [ -n "$IMAGE_URL" ] && [ "$IMAGE_URL" != "null" ]; then
                    PAYLOAD=$(jq -n \
                      --arg title "$TITLE" \
                      --arg url "$ARENA_BLOCK_URL" \
                      --arg img "$IMAGE_URL" \
                      --arg ch "$CHANNEL_NAME" \
                      '{blocks: [{type: "section", text: {type: "mrkdwn", text: ("*Nuevo en [" + $ch + "]:* <" + $url + "|" + $title + ">")}}, {type: "image", image_url: $img, alt_text: (if $title == "" then "Imagen de Are.na" else $title end)}]}')
                  else
                    PAYLOAD=$(jq -n \
                      --arg title "$TITLE" \
                      --arg url "$ARENA_BLOCK_URL" \
                      --arg ch "$CHANNEL_NAME" \
                      '{blocks: [{type: "section", text: {type: "mrkdwn", text: ("*Nuevo en [" + $ch + "]:* <" + $url + "|" + $title + ">")}}]}')
                  fi

                  # 5. Enviar a Slack
                  curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK"
                  
                  echo "$BLOCK_ID" >> processed_ids.txt
                  sleep 1
                fi
              fi
            done
          done

      - name: Save Processed Blocks History
        uses: actions/cache/save@v4
        if: always()
        with:
          path: processed_ids.txt
          key: arena-processed-blocks-${{ github.run_id }}
